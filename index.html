
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг Воздушной Обстановки</title>
    <!-- Подключаем Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            background: #111; 
            font-family: sans-serif; 
            overflow: hidden; 
        }
        #map { 
            width: 100%; 
            height: 100%; 
            background: #1a1a1a; /* Цвет фона, если нет интернета */
        }
        .map-icon { 
            font-size: 26px; 
            text-align: center; 
            font-weight: bold; 
        }
        .icon-label { 
            font-size: 11px; 
            color: #fff; 
            background: rgba(0, 0, 0, 0.8); 
            padding: 2px 5px; 
            border-radius: 4px; 
            white-space: nowrap; 
            display: block; 
            margin-top: 4px; 
            font-family: monospace; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(20, 20, 20, 0.95);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: monospace;
            border: 1px solid #333;
            width: 230px;
        }
        .status-online { color: #00ffcc; font-weight: bold; }
        .status-offline { color: #ff3333; font-weight: bold; }
        .test-btn {
            display: block;
            width: 100%;
            margin-top: 8px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            text-align: left;
        }
        .test-btn:hover {
            background: #3a3a3a;
        }
    </style>
</head>
<body>

<div id="control-panel">
    <div>Связь с ботом: <span id="status-text" class="status-offline">ОТКЛЮЧЕНА</span></div>
    <hr style="border:0; border-top:1px solid #333; margin:10px 0;">
    <div style="color:#aaa; margin-bottom:5px;">Ручной тест (100% рабочий):</div>
    <button class="test-btn" onclick="triggerTest('missile', 1800, '🚀 Баллистика', 'днепр')">🚀 Ракета на Днепр</button>
    <button class="test-btn" onclick="triggerTest('drone', 52, '🛩️ Герань', 'днепр')">🛩️ Герань на Днепр</button>
    <button class="test-btn" onclick="triggerTest('fpv', 35, '🛸 FPV-Ближний', 'днепр')">🛸 FPV в Днепре (Ближний)</button>
    <button class="test-btn" onclick="triggerTest('fpv', 35, '🛸 FPV-Ближний', 'таганрог')">🛸 FPV в Таганроге (Ближний)</button>
</div>

<div id="map"></div>

<!-- Подключаем Leaflet JS -->
<script src="https://unpkg.com"></script>
<script>
    // Базовые координаты центров городов
    const CITIES_COORDS = {
        "днепр": { lat: 48.4647, lon: 35.0462 },
        "таганрог": { lat: 47.2357, lon: 38.8969 }
    };

    // Точки дальних пусков (Крым и Краснодарский край)
    const LONG_RANGE_SOURCES = {
        "днепр": { lat: 45.1000, lon: 34.1000 },
        "таганрог": { lat: 45.0354, lon: 38.9753 }
    };

    // Инициализация карты
    const map = L.map('map').setView([48.0, 36.5], 6);
    
    // Подгружаем карту мира (необходим доступ к интернету)
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Функция ручного клика по кнопкам
    function triggerTest(type, speed, label, targetCity) {
        const target = CITIES_COORDS[targetCity];
        let source;

        if (type === 'fpv') {
            // Реалистичный FPV: создаем точку пуска всего в 0.03 градуса (~3 км) от центра города
            source = {
                lat: target.lat - 0.02 + Math.random() * 0.04,
                lon: target.lon - 0.02 + Math.random() * 0.04
            };
        } else {
            // Для ракет и Гераней берем дальние точки пуска
            source = LONG_RANGE_SOURCES[targetCity] || LONG_RANGE_SOURCES["днепр"];
        }

        animateThreat(source, target, type, speed, label);
    }

    // Функция плавной анимации
    function animateThreat(fromCoord, toCoord, type, speedMps, labelText) {
        const fromLatLng = L.latLng(fromCoord.lat, fromCoord.lon);
        const toLatLng = L.latLng(toCoord.lat, toCoord.lon);
        
        const distance = fromLatLng.distanceTo(toLatLng);
        const durationMs = (distance / speedMps) * 1000;

        let iconHtml = '🚀';
        let lineColor = '#ff3333';
        let lineDash = 'none';

        if (type === 'drone') { 
            iconHtml = '🛩️'; 
            lineColor = '#ffcc00'; 
            lineDash = '6, 8'; 
        } else if (type === 'fpv') { 
            iconHtml = '🛸'; 
            lineColor = '#00ffff'; 
            lineDash = '3, 3'; 
        }

        const pathLine = L.polyline([fromLatLng, toLatLng], {
            color: lineColor, dashArray: lineDash, weight: 3, opacity: 0.7
        }).addTo(map);

        // ИСПРАВЛЕНО: синтаксис divIcon полностью очищен от ошибок
        const customIcon = L.divIcon({
            className: 'map-icon',
            html: `<div>${iconHtml}<span class="icon-label">${labelText}</span></div>`,
            iconSize: [30, 30]
        });
        
        const marker = L.marker(fromLatLng, { icon: customIcon }).addTo(map);
        const startTime = performance.now();

        function move(now) {
            let progress = (now - startTime) / durationMs;
            if (progress > 1) progress = 1;

            let currentLat = fromCoord.lat + (toCoord.lat - fromCoord.lat) * progress;
            let currentLon = fromCoord.lon + (toCoord.lon - fromCoord.lon) * progress;
            marker.setLatLng([currentLat, currentLon]);

            if (progress < 1) {
                requestAnimationFrame(move);
            } else {
                map.removeLayer(marker);
                pathLine.setStyle({ opacity: 0.15 });
                
                const alertCircle = L.circleMarker(toLatLng, {
                    radius: 15, color: lineColor, fillColor: lineColor, fillOpacity: 0.4
                }).addTo(map);
                
                setTimeout(() => map.removeLayer(alertCircle), 4000);
            }
        }
        requestAnimationFrame(move);
    }

    // Вебсокет для связи с python-ботом
    const statusText = document.getElementById('status-text');
    function connectWebSocket() {
        const socket = new WebSocket('ws://localhost:8000');
        socket.onopen = function() {
            statusText.textContent = "ПОДКЛЮЧЕНО";
            statusText.className = "status-online";
        };
        socket.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                animateThreat(data.from, data.to, data.type, data.speed, data.label);
            } catch (e) {}
        };
        socket.onclose = function() {
            statusText.textContent = "ОТКЛЮЧЕНА";
            statusText.className = "status-offline";
            setTimeout(connectWebSocket, 4000);
        };
    }
    connectWebSocket();
</script>
</body>
</html>
