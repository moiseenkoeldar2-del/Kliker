<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная Система Мониторинга Воздушных Целей</title>
    
    <!-- Гарантированное подключение карты мира Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            background: #111; 
            font-family: monospace; 
            overflow: hidden; 
        }
        #map { 
            width: 100%; 
            height: 100%; 
            background: #151515; 
        }
        /* Стилизация маркеров летящих объектов */
        .map-icon { 
            font-size: 28px; 
            text-align: center; 
            font-weight: bold;
        }
        .icon-label { 
            font-size: 11px; 
            color: #fff; 
            background: rgba(15, 15, 15, 0.9); 
            padding: 2px 6px; 
            border-radius: 4px; 
            white-space: nowrap; 
            display: inline-block; 
            margin-top: 2px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        /* Главная панель управления */
        #control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: rgba(20, 20, 20, 0.95);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #333;
            width: 260px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .status-online { color: #00ffcc; font-weight: bold; }
        .status-offline { color: #ff3333; font-weight: bold; }
        
        .test-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            background: #252525;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-family: monospace;
            text-align: left;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        .test-btn:hover {
            background: #353535;
            border-color: #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<!-- Панель управления и индикации связи с ботом Telegram -->
<div id="control-panel">
    <div>Связь с ботом: <span id="status-text" class="status-offline">ОТКЛЮЧЕНА</span></div>
    <hr style="border:0; border-top:1px solid #333; margin:12px 0;">
    <div style="color:#888; font-size:11px; margin-bottom:5px; text-transform:uppercase;">Панель симуляции целей:</div>
    <button class="test-btn" onclick="triggerTest('missile', 1800, '🚀 Баллистика', 'днепр')">🚀 Запуск: Ракета на Днепр</button>
    <button class="test-btn" onclick="triggerTest('drone', 52, '🛩️ Герань', 'днепр')">🛩️ Запуск: Герань на Днепр</button>
    <button class="test-btn" onclick="triggerTest('fpv', 35, '🛸 FPV-Дрон', 'днепр')">🛸 Запуск: FPV в Днепре (Ближний)</button>
    <button class="test-btn" onclick="triggerTest('fpv', 35, '🛸 FPV-Дрон', 'таганрог')">🛸 Запуск: FPV в Таганроге (Ближний)</button>
</div>

<!-- Блок отображения карты мира -->
<div id="map"></div>

<script>
    // 1. Инициализация карты мира и масштабирование на регион
    const map = L.map('map').setView([48.0, 36.5], 6);
    
    // Подгрузка надежной глобальной карты мира
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 19
    }).addTo(map);

    // Географический справочник городов-целей
    const CITIES_COORDS = {
        "днепр": { lat: 48.4647, lon: 35.0462 },
        "таганрог": { lat: 47.2357, lon: 38.8969 }
    };

    // Точки дальних баз пуска для ракет и Гераней
    const LONG_RANGE_SOURCES = {
        "днепр": { lat: 45.1000, lon: 34.1000 }, // Направление Юг
        "таганрог": { lat: 45.0354, lon: 38.9753 } // Направление Юго-Запад
    };

    // Логика кнопок ручной симуляции угроз
    function triggerTest(type, speed, label, targetCity) {
        const target = CITIES_COORDS[targetCity];
        let source;

        if (type === 'fpv') {
            // Для FPV генерируем запуск в радиусе всего 3-4 км от центра города (реалистично)
            source = {
                lat: target.lat - 0.03 + Math.random() * 0.06,
                lon: target.lon - 0.03 + Math.random() * 0.06
            };
        } else {
            // Для ракет и стратегических БПЛА берем дальние стартовые точки
            source = LONG_RANGE_SOURCES[targetCity] || LONG_RANGE_SOURCES["днепр"];
        }

        animateThreat(source, target, type, speed, label);
    }

    // Движок плавной анимации полета объектов с реальной скоростью
    function animateThreat(fromCoord, toCoord, type, speedMps, labelText) {
        const fromLatLng = L.latLng(fromCoord.lat, fromCoord.lon);
        const toLatLng = L.latLng(toCoord.lat, toCoord.lon);
        
        // Математический расчет дистанции и точного времени полета в миллисекундах
        const distance = fromLatLng.distanceTo(toLatLng);
        const durationMs = (distance / speedMps) * 1000;

        let iconHtml = '🚀';
        let lineColor = '#ff3333';
        let lineDash = 'none';

        if (type === 'drone') { 
            iconHtml = '🛩️'; 
            lineColor = '#ffcc00'; 
            lineDash = '6, 8'; 
        } else if (type === 'fpv') { 
            iconHtml = '🛸'; 
            lineColor = '#00ffff'; 
            lineDash = '3, 4'; 
        }

        // Отрисовка траекторной линии движения цели
        const pathLine = L.polyline([fromLatLng, toLatLng], {
            color: lineColor, 
            dashArray: lineDash, 
            weight: 3, 
            opacity: 0.7
        }).addTo(map);

        // Сборка графического контейнера иконки и подписи
        const customIcon = L.divIcon({
            className: 'map-icon',
            html: `<div>${iconHtml}<br><span class="icon-label">${labelText}</span></div>`,
            iconSize:,
            iconAnchor: [15, 21]
        });
        
        const marker = L.marker(fromLatLng, { icon: customIcon }).addTo(map);
        const startTime = performance.now();

        // Цикл покадровой отрисовки положения объекта (requestAnimationFrame)
        function move(now) {
            let progress = (now - startTime) / durationMs;
            if (progress > 1) progress = 1;

            let currentLat = fromCoord.lat + (toCoord.lat - fromCoord.lat) * progress;
            let currentLon = fromCoord.lon + (toCoord.lon - fromCoord.lon) * progress;
            marker.setLatLng([currentLat, currentLon]);

            if (progress < 1) {
                requestAnimationFrame(move); // Переход к следующему кадру
            } else {
                // Объект долетел до цели: удаляем маркер и гасим траекторию
                map.removeLayer(marker);
                pathLine.setStyle({ opacity: 0.15 });
                
                // Эффект фиксации прилета (пульсирующий круг)
                const alertCircle = L.circleMarker(toLatLng, {
                    radius: 18, 
                    color: lineColor, 
                    fillColor: lineColor, 
                    fillOpacity: 0.4
                }).addTo(map);
                
                // Очистка индикатора через 4 секунды
                setTimeout(() => map.removeLayer(alertCircle), 4000);
            }
        }
        requestAnimationFrame(move);
    }

    // Постоянное WebSocket-соединение с вашим Python-ботом
    const statusText = document.getElementById('status-text');
    function connectWebSocket() {
        const socket = new WebSocket('ws://localhost:8000');
        
        socket.onopen = function() {
            statusText.textContent = "ПОДКЛЮЧЕНО";
            statusText.className = "status-online";
        };
        
        socket.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                // Автоматический запуск анимации по команде из Telegram
                animateThreat(data.from, data.to, data.type, data.speed, data.label);
            } catch (e) {
                console.error("Ошибка десериализации данных:", e);
            }
        };
        
        socket.onclose = function() {
            statusText.textContent = "ОТКЛЮЧЕНА";
            statusText.className = "status-offline";
            // Попытка автоматического переподключения каждые 4 секунды
            setTimeout(connectWebSocket, 4000);
        };
    }
    
    // Старт подключения бэкенда
    connectWebSocket();
</script>
</body>
</html>
