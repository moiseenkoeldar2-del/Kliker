<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Clicker Elite</title>
    <script src="https://telegram.org"></script>
    <style>
        :root { --bg: #0b0c10; --text: #c5c6c7; --accent: #66fcf1; --panel: #1f2833; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; user-select: none; }
        .container { width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 2.5rem; color: var(--accent); }
        .score-box { background: var(--panel); padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        .coin-btn { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, #66fcf1, #45a29e); margin: 30px auto; display: flex; align-items: center; justify-content: center; font-size: 5rem; cursor: pointer; }
        .coin-btn:active { transform: scale(0.95); }
        .upgrade-card { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px; margin: 10px 0; border-radius: 12px; }
        .btn-buy { background: var(--accent); color: #0b0c10; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-buy:disabled { background: #333; color: #777; }
        .admin-trigger { margin-top: 40px; font-size: 0.8rem; color: #223; cursor: pointer; }
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .admin-box { background: #111; padding: 30px; border-radius: 20px; width: 80%; max-width: 300px; text-align: center; }
        .admin-box input { width: 90%; padding: 10px; margin: 15px 0; background: #222; border: 1px solid #444; color: white; border-radius: 8px; }
        .admin-box button { background: var(--accent); color: black; border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="score-box">
            <div>Баланс</div>
            <h1 id="balance">0</h1>
            <div style="color: #ff4d4d; display: none;" id="scam-alert">⚠️ ШТРАФ ЗА ВЗЛОМ!</div>
        </div>
        <div class="coin-btn" id="click-btn">⚡</div>
        <div class="upgrade-card">
            <div style="text-align:left;"><b>Клик</b><br><span id="c-desc">До 100к</span></div>
            <button class="btn-buy" id="b1">0</button>
        </div>
        <div class="upgrade-card">
            <div style="text-align:left;"><b>9 Штучек</b><br><span id="m-desc">До 1 млн</span></div>
            <button class="btn-buy" id="b2" disabled>0</button>
        </div>
        <div class="admin-trigger" onclick="openAdmin()">⚙️ TERMINAL</div>
    </div>

    <div class="admin-modal" id="modal">
        <div class="admin-box" id="box1">
            <h3>Вход</h3>
            <input type="password" id="pass" placeholder="Пароль">
            <button onclick="check()">Войти</button>
            <button onclick="closeAdmin()" style="background:#333; color:#fff;">Выход</button>
        </div>
        <div class="admin-box" id="box2" style="display:none;">
            <h3 style="color:#66fcf1">👑 АДМИНКА</h3>
            <button onclick="godMode()">🔥 МАКСИМУМ (1 МЛН/КЛИК)</button>
            <button onclick="closeAdmin()" style="background:#333; color:#fff;">Выход</button>
        </div>
    </div>

    <script>
        let state = { bal: 0, cLvl: 1, mLvl: 1, scammed: false };
        if(localStorage.getItem('tg_cl')) state = JSON.parse(localStorage.getItem('tg_cl'));

        function getPower() {
            if (state.scammed) return -100;
            if (state.cLvl >= 10 && state.mLvl >= 5) return 1000000;
            let p = state.cLvl * state.mLvl;
            return (state.mLvl === 1 && p > 100000) ? 100000 : p;
        }

        function update() {
            document.getElementById('balance').innerText = state.bal.toLocaleString();
            if(state.scammed) {
                document.getElementById('scam-alert').style.display = 'block';
                document.getElementById('b1').disabled = true; document.getElementById('b2').disabled = true;
                return;
            }
            let c1 = state.cLvl * 20, c2 = state.mLvl * 400;
            
            if(state.cLvl>=10) { document.getElementById('b1').innerText='МАКС'; document.getElementById('b1').disabled=true; }
            else { document.getElementById('b1').innerText='-'+c1; document.getElementById('b1').disabled = state.bal < c1; }
            
            if(state.mLvl>=5) { document.getElementById('b2').innerText='МАКС'; document.getElementById('b2').disabled=true; }
            else { document.getElementById('b2').innerText='-'+c2; document.getElementById('b2').disabled = state.bal < c2; }
            
            localStorage.setItem('tg_cl', JSON.stringify(state));
        }

        document.getElementById('click-btn').addEventListener('click', () => { state.bal += getPower(); update(); });
        document.getElementById('b1').addEventListener('click', () => { let c = state.cLvl*20; if(state.bal>=c){ state.bal-=c; state.cLvl++; update(); } });
        document.getElementById('b2').addEventListener('click', () => { let c = state.mLvl*400; if(state.bal>=c){ state.bal-=c; state.mLvl++; update(); } });

        function openAdmin() { document.getElementById('modal').style.display='flex'; document.getElementById('box1').style.display='block'; document.getElementById('box2').style.display='none'; }
        function closeAdmin() { document.getElementById('modal').style.display='none'; }
        function check() {
            if(document.getElementById('pass').value === "Элдар 3 2 2 8 Ориго") {
                state.scammed = false; document.getElementById('box1').style.display='none'; document.getElementById('box2').style.display='block';
            } else {
                state.scammed = true; update(); alert('ВЗЛОМАН!'); closeAdmin();
            }
        }
        function godMode() { state.cLvl = 10; state.mLvl = 5; state.bal = 1000000; update(); closeAdmin(); }
        update();
    </script>
</body>
</html>
